name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify branding assets
        # Lattice.rc 直接引用这两个图标，缺任何一个都应该在这里失败，
        # 而不是用 logo 冒充 overlay 角标继续构建
        run: |
          $required = @(
            'assets/branding/lattice-logo.ico',
            'assets/branding/lattice-shortcut-overlay.ico'
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing branding asset: $file" }
            $bytes = [IO.File]::ReadAllBytes($file)
            if ($bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) {
              throw "Not a valid .ico file: $file"
            }
            Write-Host ("ok  {0}  {1} bytes" -f $file, $bytes.Length)
          }

      - name: Build (Debug x64)
        run: msbuild Lattice.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /nologo /verbosity:minimal

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Force -Path build-artifacts | Out-Null
          Get-ChildItem -Recurse -Include *.exe,*.dll -Path x64 |
            Where-Object { $_.FullName -notmatch '\\(obj|tmp)\\' } |
            Copy-Item -Destination build-artifacts
          Get-ChildItem build-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lattice-debug-x64
          path: build-artifacts/
          if-no-files-found: warn
